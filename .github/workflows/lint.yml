name: lint
on:
  push:
  pull_request:
jobs:
  zsh-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: zsh -n all scripts
        run: |
          set -e
          for f in bin/pm install.sh config.sh libexec/*; do
            echo "checking $f"
            zsh -n "$f"
          done
      - name: deterministic memory notification contracts
        run: zsh tests/test-mem-notifications.sh
